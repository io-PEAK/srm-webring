# Validates data/members.json whenever a pull request touches it.
# Fails on duplicate site URLs or missing required fields, then
# auto-merges the valid PR. A separate cleanup job waits for the
# merge to actually complete before deleting the PR's branch
# (gh pr merge --auto only enables auto-merge; it does not wait).
name: Validate Join PR
on:
  pull_request:
    paths:
      - "data/members.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate members.json
        run: |
          node -e "
          const members = require('./data/members.json');
          
          const websites = members.map(m => m.website).filter(Boolean);
          if (new Set(websites).size !== websites.length) {
            console.error('Duplicate website URL found');
            process.exit(1);
          }

          for (const m of members) {
            if (!m.name || !m.website || !m.gradDate || !m.program || !m.badge || !m.location) {
              console.error('Missing required field on entry:', m);
              process.exit(1);
            }
          }
          console.log('Validation passed');
          "

      - name: Auto-merge if valid
        if: success()
        run: gh pr merge "${{ github.event.pull_request.number }}" --merge --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs after the validate job, by which point the required "validate"
  # check is successful, so GitHub can finish the auto-merge while we poll.
  cleanup:
    needs: validate
    if: success()
    runs-on: ubuntu-latest
    steps:
      # gh needs a git repo to resolve the target repository, and the
      # branch delete is a git refs API call. Without a checkout this job
      # failed with "failed to run git: fatal: not a git repository".
      - uses: actions/checkout@v4
      - name: Wait for merge and delete branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"

          merged=0
          for i in $(seq 1 36); do
            state=$(gh pr view "$PR" --json state --jq .state)
            if [[ "$state" == "MERGED" ]]; then
              merged=1
              break
            fi
            sleep 5
          done

          if [[ "$merged" != "1" ]]; then
            echo "::error::PR #$PR did not merge within 3 minutes; branch kept."
            exit 1
          fi

          echo "PR #$PR merged — deleting branch ${{ github.head_ref }}"
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.head_ref }}"

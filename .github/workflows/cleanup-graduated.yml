# Runs daily at midnight UTC (plus manual dispatch). Removes members
# whose graduation date is past the 30-day grace period and emails
# them via the Worker's /notify endpoint.
#
# Direct pushes to main are blocked by branch protection (the
# "validate" status check only runs on pull requests), so the results
# are pushed as a pull request that the Validate Join PR workflow
# validates and auto-merges.
name: Remove Graduated Members
on:
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove members past grace period
        run: |
          node -e "
          const fs = require('fs');
          const members = require('./data/members.json');

          const LOOKUP_SECRET = process.env.LOOKUP_SECRET;
          const NOTIFY_URL = 'https://backend.srmwebring.workers.dev/notify';

          const now = new Date();
          const cutoffDays = 30; // 1 month grace period

          (async () => {
            const remaining = [];
            const graduated = [];

            for (const m of members) {
              const gradDate = new Date(m.gradDate);
              const graceEnd = new Date(gradDate);
              graceEnd.setDate(graceEnd.getDate() + cutoffDays);
              
              if (now > graceEnd) {
                graduated.push(m);
              } else {
                remaining.push(m);
              }
            }

            if (graduated.length > 0) {
              console.log('Found ' + graduated.length + ' graduated member(s) to remove.');
              for (const m of graduated) {
                console.log('Notifying graduation for:', m.website);
                try {
                  await fetch(NOTIFY_URL, {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'Authorization': 'Bearer ' + LOOKUP_SECRET
                    },
                    body: JSON.stringify({ site: m.website, type: 'graduation' })
                  });
                } catch (err) {
                  console.error('Failed to notify graduation for ' + m.website + ':', err.message);
                }
              }
              
              fs.writeFileSync('./data/members.json', JSON.stringify(remaining, null, 2));
              console.log('Removed graduated members from JSON');
            } else {
              console.log('No members to remove');
            }
          })();
          "
        env:
          LOOKUP_SECRET: ${{ secrets.LOOKUP_SECRET }}

      - name: Open PR with graduated-member cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Nothing changed — skip. (git diff --quiet exits 1 when changed;
          # inside an `if` it is exempt from the step's set -e.)
          if git diff --quiet data/members.json; then
            echo "No graduated members to remove; skipping."
            exit 0
          fi

          BRANCH="ci/cleanup-graduated-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/members.json
          git commit -m "chore: remove graduated members"
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "chore: remove graduated members" \
            --body "Automated graduation cleanup. The **Validate Join PR** workflow validates and auto-merges this."

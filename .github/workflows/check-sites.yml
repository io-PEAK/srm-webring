# Scheduled health check (every 3 days, plus manual dispatch) that
# probes each member's website. Reachable sites get warning flags
# cleared; unreachable sites are flagged hidden.
#
# Direct pushes to main are blocked by branch protection (the
# "validate" status check only runs on pull requests), so the results
# are pushed as a pull request that the Validate Join PR workflow
# validates and auto-merges.
name: Check Member Sites
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check site reachability
        run: |
          node -e "
          const fs = require('fs');
          const members = require('./data/members.json');

          (async () => {
            for (const m of members) {
              try {
                // Fetch with timeout to prevent hanging on down sites
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                
                const res = await fetch(m.website, { 
                  method: 'GET',
                  headers: { 'User-Agent': 'SRM-Webring-Bot/1.0' },
                  signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (res.ok) {
                  // Site is fine: restore and clear warning flags
                  delete m.unreachableSince;
                  delete m.hidden;
                  delete m.warningEmailSent;
                } else {
                  m.unreachableSince = m.unreachableSince || new Date().toISOString();
                  m.hidden = true;
                }
              } catch (e) {
                m.unreachableSince = m.unreachableSince || new Date().toISOString();
                m.hidden = true;
              }
            }

            fs.writeFileSync('./data/members.json', JSON.stringify(members, null, 2));
          })();
          "

      - name: Open PR with health check results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Nothing changed — skip. (git diff --quiet exits 1 when changed;
          # inside an `if` it is exempt from the step's set -e.)
          if git diff --quiet data/members.json; then
            echo "No member status changes; skipping."
            exit 0
          fi

          BRANCH="ci/check-sites-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/members.json
          git commit -m "chore: update site health status (3-day check)"
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "chore: update site health status (3-day check)" \
            --body "Automated health-check results. The **Validate Join PR** workflow validates and auto-merges this."

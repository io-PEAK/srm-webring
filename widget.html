<!-- ============================================================
     widget.html — SRM WebRing embeddable ring widget
     Snippet members paste into their site footer: prev / next
     arrows and a hub link, stepping the ring via URL hash
     (#member-url?nav=prev|next) on the hosted landing page.
     ============================================================ -->
<div class="ring-widget">
  <!-- Prev / next arrows step the ring via a hash of the member URL + ?nav=prev|next -->
  <a href="https://io-PEAK.github.io/srm-ncr-webring/#https://example.com/priya?nav=prev" class="ring-arrow">←</a>
  <!-- Hub link: returns to the ring landing page, which resolves the ring from the hash -->
  <a href="https://io-PEAK.github.io/srm-ncr-webring/" class="ring-logo">SRM</a>
  <a href="https://io-PEAK.github.io/srm-ncr-webring/#https://example.com/priya?nav=next" class="ring-arrow">→</a>
</div>

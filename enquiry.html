<!-- ============================================================
     enquiry.html — SRM WebRing enquiry form
     Subpage for reporting broken links, requesting removals,
     graduation-date corrections, and badge changes; validated
     by js/enquiry.js with status shown in #output.
     ============================================================ -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#AF272F">
    <title>Enquire | SRM WebRing</title>
    <link rel="icon" href="img/tree_yellow.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="subpage">
    <a href="index.html" class="skip-link">Back to ring</a>

    <main class="panel-inner enquiry-inner">
        <a href="index.html" class="back-link">&larr; Back to ring</a>

        <h1>Enquire<span class="h1-accent">.</span></h1>
        <p>Report a broken link, ask for a removal, fix a date, or send anything else our way.</p>

        <!-- ── Enquiry form; submitted and validated by js/enquiry.js ── -->
        <form id="enquiryForm" class="join-form" novalidate>
            <label>
                Name
                <input type="text" id="name" required placeholder="Your name">
            </label>

            <label>
                Email
                <input type="email" id="email" required placeholder="Your registered email">
            </label>

            <label>
                Type
                <select id="type" required>
                    <option value="" disabled selected>Select a request type</option>
                    <option value="broken-link">Report broken link</option>
                    <option value="grad-date-correction">Graduation date correction</option>
                    <option value="removal">Remove me from ring</option>
                    <option value="badge-change">Badge change</option>
                    <option value="other">Other enquiry</option>
                </select>
            </label>

            <label class="field-full">
                Details
                <textarea id="details" required placeholder="Specify details here (e.g. website URL that is broken, or corrected graduation date)..."></textarea>
            </label>

            <button type="submit" class="join-submit" id="enquirySubmit">Submit request</button>
        </form>

        <!-- Submission status (populated by js/enquiry.js) -->
        <div id="output" class="join-status" role="status"></div>
    </main>

    <script src="js/enquiry.js"></script>
</body>
</html>
